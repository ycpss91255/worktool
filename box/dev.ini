# box/dev.ini - worktool shared "dev" box manifest.
#
# This is a native distrobox-assemble manifest (INI). worktool adopts the
# upstream format verbatim rather than inventing its own, so it stays
# compatible with `distrobox assemble create --file box/dev.ini` and with
# every distrobox-assemble key (image, additional_packages, init_hooks, ...).
# See doc/manifest.md.
#
# The section header is the box NAME; every worktool CLI/TUI tool lives in
# this one shared "dev" box (doc/design.md). M2 shipped a deliberately
# minimal tool set (ripgrep, fzf) as a proof of the assemble flow. M3
# (issue #160) adds tmux and fish: `just box setup` points the terminal at
# `distrobox enter dev`, the box's fish is the shell behind it, and tmux is
# what the user starts inside the box. Only the packages live here; their
# configuration (dotfiles, theme, plugins) is M5. The full tool set is
# ported across M5-M10.
#
# The box's own tmux server (M3, issue #179). distrobox bind-mounts the
# host's /tmp into the box, and tmux keeps its default socket there
# (/tmp/tmux-<uid>/default), so a `tmux` typed in the box would attach to
# the HOST's server. Two keys keep them apart:
#   additional_flags  TMUX_TMPDIR as a CONTAINER env, so every process in
#                     the box inherits it (any shell, `distrobox enter dev
#                     -- tmux`, ...). ${HOME} is expanded when the box is
#                     created; the directory is the box's own, under
#                     ~/dev-box (the box HOME of issue #196).
#   init_hooks        creates that directory, as the box user and mode
#                     0700, on every box start: tmux does not create it,
#                     and when it is missing tmux falls back to /tmp
#                     SILENTLY. container_user_uid / container_user_gid are
#                     the box user's ids as distrobox-init receives them
#                     (--user / --group; pinned distrobox 1.8.2.5).
#   init_hooks (2nd)  installs box/tmux-guard.sh as the box's
#                     /usr/local/bin/tmux, on every box start. `distrobox
#                     enter` copies the caller's TMUX into the box, and
#                     tmux prefers $TMUX over TMUX_TMPDIR: entered from a
#                     HOST tmux pane, it would reach the host server. The
#                     guard keeps TMUX only when it names a socket under
#                     the box's TMUX_TMPDIR. A manifest line cannot carry a
#                     script, so the line holds box/tmux-guard.sh as base64;
#                     test/unit/box_tmux_guard_spec.bats keeps the two
#                     identical (regenerate: base64 -w0 <box/tmux-guard.sh).
#                     Repeated init_hooks run in order, joined with &&.
# Kept on ONE line each: distrobox-assemble reads one key per line.

[dev]
image=ubuntu:26.04
additional_packages="ripgrep fzf tmux fish"
additional_flags="--env TMUX_TMPDIR=${HOME}/dev-box/.cache/tmux"
init_hooks=setpriv --reuid="${container_user_uid}" --regid="${container_user_gid}" --clear-groups mkdir -p -m 0700 "${TMUX_TMPDIR}"
init_hooks=echo  | base64 -d >/usr/local/bin/tmux && chmod 0755 /usr/local/bin/tmux
