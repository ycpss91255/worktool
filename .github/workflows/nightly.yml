name: Nightly

# Nightly full serial run (issue #836, maintainer decision recorded on
# #824). On main, on both architectures: bare `just test` (the seven tiers
# in order, stop at the first failure, exactly what a user types) and then
# acceptance 2.3's checks again (integration and system-real), all serial
# in one job per runner, no sharding, no reuse of PR results.
#
# Duplicate rule (#836): an open issue labelled `nightly-failure` means
# the last failure is not resolved yet, so a SCHEDULED run does not run
# the suite: it logs which issue caused the skip and ends green, with no
# new issue and no new comment. A manual run (workflow_dispatch) always
# runs, so a fix can be verified. If the open issues cannot be listed the
# suite runs anyway (a broken check never skips silently). A failed run
# with nothing open opens exactly one new `nightly-failure` issue with the
# run link; any run with an open issue puts its run link on that issue
# (green or red); closing stays with the fixing PR or a person. The rules
# live in lib/nightly.sh (test/unit/nightly_spec.bats).

on:
  schedule:
    - cron: '0 19 * * *'  # 03:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  decide:
    name: decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip while an earlier nightly failure is unresolved
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          source lib/nightly.sh
          rc=0
          gh label create "${NIGHTLY_LABEL}" -R "${REPO}" --color B60205 \
            --description 'Nightly full serial run failed and is not resolved yet' --force || rc=$?
          open=''
          if [ "${rc}" -eq 0 ]; then
            open="$(gh issue list -R "${REPO}" --label "${NIGHTLY_LABEL}" --state open --json number --jq '.[].number')" || rc=$?
          fi
          decision="$(nightly_decide "${EVENT}" "${rc}" "${open}")" || exit 1
          echo "decision: ${decision}"
          if [ "${decision}" = run ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

  full-serial:
    name: full-serial (${{ matrix.runner }})
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Bare just test (seven tiers in order, serial)
        run: just test

      - name: Acceptance 2.3 checks again (integration, system-real)
        run: |
          set -euo pipefail
          just test integration
          just test system-real

      # Tier isolation guard (issue #835, ADR-0018): the same stages in a
      # seeded random order, failing on anything a stage leaves behind on
      # the runner. The seed is in the log; `just test isolation --seed N`
      # reproduces the order.
      - name: Tier isolation (random order, residue check)
        run: just test isolation

  report:
    name: report
    needs: [decide, full-serial]
    if: always() && needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.full-serial.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          source lib/nightly.sh
          rc=0
          open="$(gh issue list -R "${REPO}" --label "${NIGHTLY_LABEL}" --state open --json number --jq '.[].number')" || rc=$?
          action="$(nightly_report "${RESULT}" "${rc}" "${open}")" || exit 1
          echo "full serial run: ${RESULT}; action: ${action}"
          body="${RUNNER_TEMP}/body.md"
          case "${action}" in
            open)
              printf '[nightly] 完整序列執行失敗（%s，commit `%s`）：%s\n\n修正合併後，以 workflow_dispatch 手動跑 Nightly 確認綠燈再關閉本 issue；本 issue 開著時排程執行會略過。\n\nmilestone: 無\n' \
                "${EVENT}" "${SHA}" "${RUN_URL}" > "${body}"
              gh issue create -R "${REPO}" --label "${NIGHTLY_LABEL}" \
                --title "nightly：完整序列執行失敗（${SHA:0:8}）" --body-file "${body}" || exit 1
              ;;
            comment\ *)
              printf '[nightly] %s 執行（commit `%s`）結果 %s：%s\n' \
                "${EVENT}" "${SHA}" "${RESULT}" "${RUN_URL}" > "${body}"
              gh issue comment "${action#comment }" -R "${REPO}" --body-file "${body}" || exit 1
              ;;
            none) ;;
            *) echo "unknown action '${action}'"; exit 1 ;;
          esac
          [ "${RESULT}" = success ]
