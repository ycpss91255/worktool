name: CI

# worktool CI: lint + unit + matrix + integration + system (shim group) + acceptance
# in the shared test image, plus system-real (real-engine group) in its own
# docker-in-docker runner. All inside Docker. Runs on push and pull_request
# to main, plus pull_request to milestone acceptance branches matching
# m*/*-acceptance (issue #389). Dedicated jobs check new-commit email
# addresses (issue #234) and attribution lines in commit messages and
# pull request bodies (issue #271).
#
# Every leg-carrying job runs on BOTH architectures (issue #149, decision B
# of #148): the `runner` matrix dimension is ubuntu-latest (amd64) and
# ubuntu-24.04-arm (arm64, GitHub-hosted). The test image is built once per
# arch and shared with that arch's gates through a per-arch artifact
# (worktool-test-image-<runner>); the DinD system-real job builds its own
# runner image on each arch. Nothing is emulated: each leg is the native
# `just test <tier>` of its runner.
#
# Every gate is driven through the `just test` namespace, i.e. the same
# grammar a user types (`just test lint`, `just test unit`, ..., `just test
# system-real`; all of them at once: bare `just test`). Each recipe is a
# thin forwarder to script/test/test.sh (`--lint`, `--unit`, ...). The
# gate NAMES stay lint / test-matrix / test-integration / test-system /
# test-acceptance / test-system-real, so a check reads "<gate> (<runner>)",
# e.g. "lint (ubuntu-24.04-arm)"; the matrix maps each name to its tier
# instead of reusing the name as the tier. Branch protection keys on the
# single `ci-passed` aggregator, not on the per-leg names.
#
# Every test leg is REQUIRED: the `ci-passed` aggregator fails unless every
# leg-carrying job finished with `success` - for a matrix job that result
# is green only when every one of its legs is; a skipped, cancelled or
# missing leg does not read as green. (Inside each bats gate, test.sh
# likewise fails on a missing or emptied required spec, on skipped cases
# and on zero cases.)
# Milestone PRs additionally require every verify-all leg to succeed;
# other PRs and main pushes do not require that conditional job.
#
# Code path vs meta path (issue #688). A PR body, title or label edit
# fires edited / labeled / unlabeled, but leaves the head sha (what the
# tiers test) unchanged. One routing expression, repeated verbatim in
# run-name, concurrency and the route job, picks the path:
#   - code path: push, opened, synchronize, reopened, adding the
#     milestone-gate label (verify-all becomes required) and an edit that
#     changes the base branch (the merge result changes). Every tier runs.
#   - meta path: any other edited / labeled / unlabeled event. The code
#     tiers are skipped; the policy jobs (PR body included) still run, and
#     prior-run requires that the latest code run of the same head sha and
#     PR finished with every test leg green (plus verify-all when the PR is
#     labelled milestone-gate NOW), via lib/ci_prior_run.sh. No such run,
#     one still running, or any non-green leg fails ci-passed: a skipped
#     tier never reads as green (fail closed).
# The two paths use separate concurrency groups, so a body edit never
# cancels a running code run; only pull_request runs cancel in progress, so
# a push to main is never cancelled. Branch protection still keys on the
# single ci-passed check; the newest ci-passed check run of the head sha
# decides, so a meta run that fails because the code run is unfinished is
# superseded by that code run's ci-passed, created after it.
#
# The test-system-real gate uses --privileged: its runner starts a
# nested dockerd so the real pinned distrobox can build and enter a real dev
# box. Everything it creates lives in that nested daemon and is destroyed
# with the runner container (docker run --rm).
# verify-all also invokes that gate through the acceptance entry.

run-name: ${{ (github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'milestone-gate') || (github.event.action == 'edited' && github.event.changes.base != null)) && 'CI code run' || 'CI meta run' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'm*/*-acceptance']
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'milestone-gate') || (github.event.action == 'edited' && github.event.changes.base != null)) && 'code' || 'meta' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Code path or meta path (see the header); every other job keys on it.
  route:
    name: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.path.outputs.code }}
    steps:
      - name: Pick the code or meta path
        id: path
        env:
          EVENT: ${{ github.event_name }}/${{ github.event.action }}
          CODE_PATH: ${{ (github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'milestone-gate') || (github.event.action == 'edited' && github.event.changes.base != null)) && 'true' || 'false' }}
        run: |
          echo "event ${EVENT}: code path=${CODE_PATH}"
          echo "code=${CODE_PATH}" >> "${GITHUB_OUTPUT}"

  # One test image per arch. The artifact name carries the runner so the two
  # legs never overwrite each other and each gate below loads its own arch.
  build-image:
    name: Build test image (${{ matrix.runner }})
    needs: route
    if: needs.route.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build worktool-test image
        run: docker build -t worktool-test:local -f dockerfile/Dockerfile.test .

      - name: Save image
        run: docker save worktool-test:local -o /tmp/worktool-test.tar

      # Shard weights (issue #831): read the newest main-push weights once
      # per arch, here, and ship them with the image so every unit shard of
      # this arch splits the tier from the same file. A miss ships an empty
      # file: every spec then weighs its @test count.
      - name: Restore shard weights
        uses: actions/cache/restore@v4
        with:
          path: .agents/state/shard-weights.tsv
          key: shard-weights-none
          restore-keys: shard-weights-

      - name: Stage shard weights
        run: |
          if [ -f .agents/state/shard-weights.tsv ]; then
            cp .agents/state/shard-weights.tsv /tmp/shard-weights.tsv
          else
            : > /tmp/shard-weights.tsv
          fi
          wc -l /tmp/shard-weights.tsv

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: worktool-test-image-${{ matrix.runner }}
          path: |
            /tmp/worktool-test.tar
            /tmp/shard-weights.tsv
          retention-days: 1

  # 6 gates x 2 runners. `needs: build-image` waits for BOTH build legs;
  # each gate leg then downloads the artifact of its own runner.
  #
  # test-integration is the one gate that also builds an image of its own:
  # its ghostty group needs a REAL ghostty, which only Ubuntu 26.04
  # packages, so `just test integration` builds dockerfile/Dockerfile.ghostty
  # and runs that group in it (no display, no daemon, no --privileged).
  # `timeout-minutes` is the outermost of the three anti-hang layers for
  # the ghostty cases (the other two: ghostty's own defaults, which close
  # the window when the command returns, and the `timeout -k` around every
  # ghostty call in the specs).
  gate:
    name: ${{ matrix.gate }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        gate: [lint, test-matrix, test-integration, test-system, test-acceptance]
        # gate = job name (unchanged; ci-passed and the per-leg check names
        #        key on it)
        # tier = the `just test <tier>` that job runs; `include` attaches it
        #        to every runner leg of the matching gate
        include:
          - gate: lint
            tier: lint
          - gate: test-matrix
            tier: matrix
          - gate: test-integration
            tier: integration
          - gate: test-system
            tier: system
          - gate: test-acceptance
            tier: acceptance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test image (${{ matrix.runner }})
        uses: actions/download-artifact@v4
        with:
          name: worktool-test-image-${{ matrix.runner }}
          path: /tmp

      - name: Load test image
        run: docker load -i /tmp/worktool-test.tar

      - name: Install just
        uses: extractions/setup-just@v2

      # 8 bats jobs (files and the cases of one file, #689): measured on the
      # 4-vCPU arm runner, unit 616 s / 503 s / 517 s and matrix 193 s /
      # 172 s / 183 s at 4 / 8 / 16 jobs, so 8 is the knee. Local runs keep
      # test.sh's default of 4.
      - name: Run gate (${{ matrix.gate }} = just test ${{ matrix.tier }})
        env:
          TEST_IMAGE_PREBUILT: "1"
          WORKTOOL_TEST_JOBS: "8"
          WORKTOOL_TEST_REPORT_DIR: .agents/state/test-report
        run: just test ${{ matrix.tier }}

      # Per-case durations (junit, issue #827): the shard weights' source.
      # Uploaded even when the gate failed; a green bats gate without a
      # report fails here instead of silently leaving the weights stale.
      - name: Upload junit report (${{ matrix.tier }})
        if: always() && matrix.tier != 'lint'
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.tier }}-${{ matrix.runner }}
          path: .agents/state/test-report
          if-no-files-found: error
          retention-days: 7

  # The unit tier as UNIT_SHARDS weighted shards per runner (issue #831):
  # `just test unit --shard I/N` assigns every test/unit spec by the
  # weights build-image shipped (lib/test_shard.sh), runs its own share,
  # checks its own required specs and an exact plan, and uploads its
  # record, TAP and junit report. No shard stands for the tier: only
  # test-unit-verdict, over all shards of both runners, does. The shard
  # count is declared here (shard, shards) and in test-unit-verdict's
  # UNIT_SHARDS; ci_yml_spec keeps them equal.
  unit-shard:
    name: test-unit ${{ matrix.shard }}/${{ matrix.shards }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        shard: [1, 2, 3, 4]
        shards: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test image (${{ matrix.runner }})
        uses: actions/download-artifact@v4
        with:
          name: worktool-test-image-${{ matrix.runner }}
          path: /tmp

      - name: Load test image
        run: docker load -i /tmp/worktool-test.tar

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Stage shard weights
        run: |
          mkdir -p .agents/state
          cp /tmp/shard-weights.tsv .agents/state/shard-weights.tsv

      - name: Run gate (test-unit = just test unit --shard ${{ matrix.shard }}/${{ matrix.shards }})
        env:
          TEST_IMAGE_PREBUILT: "1"
          WORKTOOL_TEST_REPORT_DIR: .agents/state/test-report
          WORKTOOL_SHARD_WEIGHTS: .agents/state/shard-weights.tsv
        run: just test unit --shard ${{ matrix.shard }}/${{ matrix.shards }}

      - name: Upload shard record and junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-unit-${{ matrix.shard }}-${{ matrix.runner }}
          path: .agents/state/test-report
          if-no-files-found: error
          retention-days: 7

  # The union verdict of the unit shards (issue #831), fail closed: for
  # each runner exactly UNIT_SHARDS records labelled i/N with one weights
  # hash, pairwise disjoint specs whose union is exactly the test/unit list
  # of THIS checkout, every required spec present with cases, and every
  # shard's plan equal to its specs' case counts with that many ok lines
  # and no failure or skip (lib/test_shard.sh). It is a leg: ci-passed and
  # the meta path's prior-run require it.
  test-unit-verdict:
    name: test-unit-verdict
    needs: [route, unit-shard]
    if: needs.route.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UNIT_SHARDS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download shard records
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-unit-*
          path: ${{ runner.temp }}/shards

      - name: Apply the whole-tier rules to the union of the shards
        run: |
          set -uo pipefail
          source lib/test_shard.sh
          list="${RUNNER_TEMP}/unit-specs"
          required="${RUNNER_TEMP}/unit-required"
          (cd test/unit && find . -type f -name '*.bats' | sed 's|^\./||' | LC_ALL=C sort) > "${list}" || exit 1
          bash -c 'source script/test/test.sh && _required_specs unit' | sed 's|^unit/||' > "${required}" || exit 1
          test_shard_verdict "${RUNNER_TEMP}/shards" unit "${UNIT_SHARDS}" "${list}" "${required}" ubuntu-latest ubuntu-24.04-arm

  # Real-engine system group: docker-in-docker, on both runners. Builds its
  # own runner image (dockerfile/Dockerfile.system-real, independent of the
  # shared test image) and runs it with `docker run --rm --privileged` via
  # `just test system-real` (= test.sh --system-real). This is the only job
  # that names --privileged explicitly (GitHub-hosted ubuntu runners, amd64 and arm64,
  # allow it). Slow: image pull + apt inside the box; the runner itself
  # bounds every step, and the job is capped too.
  test-system-real:
    name: test-system-real (${{ matrix.runner }})
    needs: route
    if: needs.route.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run gate (test-system-real = just test system-real, docker-in-docker, --privileged)
        run: just test system-real

  # Milestone acceptance runs the checkout's real entry, not verify stubs.
  # `all` excludes section 5 (realbox); it drives Docker gates itself.
  # The native Ghostty image supplies the same real terminal as integration;
  # the verify image adds host tools and the shared image's pinned distrobox.
  verify-all:
    name: verify-all (${{ matrix.runner }})
    if: needs.route.outputs.code == 'true' && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'milestone-gate')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    needs: [route, build-image]
    permissions:
      contents: read
      pull-requests: read
      checks: read
      issues: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test image (${{ matrix.runner }})
        uses: actions/download-artifact@v4
        with:
          name: worktool-test-image-${{ matrix.runner }}
          path: /tmp

      - name: Load test image
        run: docker load -i /tmp/worktool-test.tar

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build and test acceptance environment
        env:
          TEST_IMAGE_PREBUILT: "1"
        run: just test verify-env

      - name: Verify non-real-machine acceptance
        env:
          TEST_IMAGE_PREBUILT: "1"
          GH_TOKEN: ${{ github.token }}
        # Docker gates mount the checkout through the runner's daemon, so
        # its absolute path must be identical inside and outside this container.
        run: |
          set -euo pipefail
          docker run --rm -e TEST_IMAGE_PREBUILT -e GH_TOKEN -e CI \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}:${PWD}" -w "${PWD}" \
            worktool-verify:local -c 'just verify all'

  # Commit email (issue #234): the repo is public, so every new commit must
  # carry a GitHub noreply author email and a noreply (or GitHub's own
  # noreply@github.com) committer email; no commit date exempts anything,
  # old history stays out through the range. The rule lives in
  # lib/commit_email.sh (pure bash, unit tested in
  # test/unit/commit_email_spec.bats); this job only picks the range (PR:
  # base..head, push: before..after, new ref: after minus the default
  # branch; a missing or malformed value the event uses fails the job
  # instead of shrinking the range), collects the records with git log
  # and fails listing each offending commit plus the fix command. No
  # token is needed: the full history is checked out without credentials.
  commit-email:
    name: commit-email
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check author and committer email of every new commit
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_REF: refs/remotes/origin/${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          source lib/commit_email.sh
          range="$(commit_email_range "${EVENT}" "${PR_BASE}" "${PR_HEAD}" "${PUSH_BEFORE}" "${PUSH_AFTER}" "${DEFAULT_REF}")" || exit 1
          mapfile -t revs <<< "${range}"
          records="${RUNNER_TEMP}/commits"
          git log --format="$(commit_email_log_format)" "${revs[@]}" -- > "${records}" || exit 1
          commit_email_evaluate < "${records}"

  # Commit attribution (issue #271): use the same fail-closed revision range
  # as commit-email, then apply the shared detector from lib/attribution.sh to
  # every selected commit message and, on pull_request events, the PR body.
  commit-attribution:
    name: commit-attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit messages and pull request body
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_REF: refs/remotes/origin/${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          source lib/commit_attribution.sh
          range="$(commit_attribution_range "${EVENT}" "${PR_BASE}" "${PR_HEAD}" "${PUSH_BEFORE}" "${PUSH_AFTER}" "${DEFAULT_REF}")" || exit 1
          mapfile -t revs <<< "${range}"
          commit_attribution_check_commits . "${revs[@]}" || exit 1
          commit_attribution_check_pr_body "${EVENT}" "${PR_BODY}"

  # Issue footers (issue #312): only new non-merge, non-web commits.
  commit-refs:
    name: commit-refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check issue footers of new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_REF: refs/remotes/origin/${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          source lib/commit_refs.sh
          range="$(commit_refs_range "${EVENT}" "${PR_BASE}" "${PR_HEAD}" "${PUSH_BEFORE}" "${PUSH_AFTER}" "${DEFAULT_REF}")" || exit 1
          mapfile -t revs <<< "${range}"
          commit_refs_check_commits . "${revs[@]}"

  review-log:
    name: review-log
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject committed review logs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_REF: refs/remotes/origin/${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          source lib/commit_email.sh
          source lib/review_log.sh
          range="$(commit_email_range "${EVENT}" "${PR_BASE}" "${PR_HEAD}" "${PUSH_BEFORE}" "${PUSH_AFTER}" "${DEFAULT_REF}")" || exit 1
          mapfile -t revs <<< "${range}"
          review_log_check_commits . "${revs[@]}"

  # Meta path only: the code tiers were skipped, so require the latest code
  # run of this head sha and PR to have passed every test leg (issue #688).
  # verify-all is required from the PR's labels NOW (live, not the event
  # payload), so removing milestone-gate stops requiring it and a label
  # still present keeps requiring it. The rule lives in lib/ci_prior_run.sh.
  prior-run:
    name: prior-run
    needs: route
    if: needs.route.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require a green code run of this head sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          source lib/ci_prior_run.sh
          labels="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.labels[].name')" || exit 1
          verify=false
          if grep -Fqx milestone-gate <<< "${labels}"; then
            verify=true
          fi
          runs="${RUNNER_TEMP}/runs"
          gh api --paginate "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${PR_HEAD}&event=pull_request&per_page=100" \
            --jq '.workflow_runs[] | [.id, .run_number, .status, .display_title, ([.pull_requests[].number | tostring] | join(" "))] | @tsv' \
            > "${runs}" || exit 1
          id="$(ci_prior_run_select "${RUN_ID}" "${PR_NUMBER}" < "${runs}")" || exit 1
          echo "latest code run of ${PR_HEAD}: ${id} (verify-all required: ${verify})"
          jobs="${RUNNER_TEMP}/jobs"
          gh api --paginate "repos/${REPO}/actions/runs/${id}/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | [.name, .status, (.conclusion // "")] | @tsv' > "${jobs}" || exit 1
          ci_prior_run_evaluate "${verify}" < "${jobs}"

  # Main push only (issue #827): merge every gate's junit report into the
  # shard weights (spec -> milliseconds, the slower runner kept; rule in
  # lib/shard_weights.sh) and save them to the actions cache. The key
  # carries the run, so each push adds an entry; a PR restores the newest
  # one by prefix. The weights only balance work, never decide what runs.
  shard-weights:
    name: shard-weights
    needs: [route, gate, unit-shard]
    if: github.event_name == 'push' && needs.route.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download junit reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-*
          path: ${{ runner.temp }}/reports

      - name: Merge the reports into shard weights
        run: |
          set -uo pipefail
          source lib/shard_weights.sh
          mkdir -p .agents/state
          shard_weights_merge "${RUNNER_TEMP}/reports" unit matrix > .agents/state/shard-weights.tsv || exit 1
          cat .agents/state/shard-weights.tsv

      - name: Save shard weights
        uses: actions/cache/save@v4
        with:
          path: .agents/state/shard-weights.tsv
          key: shard-weights-${{ github.run_id }}-${{ github.run_attempt }}

  # Single required status: green only if every build-image leg AND every
  # matrix gate leg AND every real-engine leg AND all commit policy jobs
  # succeeded, plus verify-all on milestone-gate PRs. `needs` on a matrix
  # job covers all of its legs, and its `result` is `success` only when
  # every leg is. `if: always()` makes it run even when a leg failed or was
  # skipped, so that state is reported as a failure rather than as "no
  # check". It is never skipped: a skipped check run would read as passing.
  # On the meta path prior-run stands in for the skipped code tiers; on
  # both paths the PR body is re-read live first, so an edit made while a
  # code run was running cannot ride on that run's earlier body check.
  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [route, build-image, gate, test-system-real, prior-run, commit-email, commit-attribution, commit-refs, review-log, verify-all, shard-weights, unit-shard, test-unit-verdict]
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Re-check the live pull request body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          source lib/commit_attribution.sh
          body="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')" || exit 1
          commit_attribution_check_pr_body pull_request "${body}"

      - name: Verify every leg succeeded
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          CODE_PATH: ${{ needs.route.outputs.code }}
          PRIOR_RESULT: ${{ needs.prior-run.result }}
          BUILD_RESULT: ${{ needs.build-image.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          UNIT_SHARD_RESULT: ${{ needs.unit-shard.result }}
          UNIT_VERDICT_RESULT: ${{ needs.test-unit-verdict.result }}
          SYSTEM_REAL_RESULT: ${{ needs.test-system-real.result }}
          EMAIL_RESULT: ${{ needs.commit-email.result }}
          ATTRIBUTION_RESULT: ${{ needs.commit-attribution.result }}
          REFS_RESULT: ${{ needs.commit-refs.result }}
          REVIEW_LOG_RESULT: ${{ needs.review-log.result }}
          VERIFY_REQUIRED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'milestone-gate') }}
          VERIFY_RESULT: ${{ needs.verify-all.result }}
          WEIGHTS_REQUIRED: ${{ github.event_name == 'push' }}
          WEIGHTS_RESULT: ${{ needs.shard-weights.result }}
        run: |
          echo "route: ${ROUTE_RESULT} (code path: ${CODE_PATH})"
          [ "${ROUTE_RESULT}" = "success" ] || exit 1
          if [ "${CODE_PATH}" = "true" ]; then
            echo "build-image (both runners): ${BUILD_RESULT}"
            echo "gate (5 gates x both runners): ${GATE_RESULT}"
            echo "test-system-real (docker-in-docker, both runners): ${SYSTEM_REAL_RESULT}"
            [ "${BUILD_RESULT}" = "success" ] || exit 1
            [ "${GATE_RESULT}" = "success" ] || exit 1
            echo "unit-shard (unit tier shards x both runners): ${UNIT_SHARD_RESULT}"
            echo "test-unit-verdict (union of the unit shards): ${UNIT_VERDICT_RESULT}"
            [ "${UNIT_SHARD_RESULT}" = "success" ] || exit 1
            [ "${UNIT_VERDICT_RESULT}" = "success" ] || exit 1
            [ "${SYSTEM_REAL_RESULT}" = "success" ] || exit 1
            echo "verify-all (required=${VERIFY_REQUIRED}, both runners): ${VERIFY_RESULT}"
            if [ "${VERIFY_REQUIRED}" = "true" ]; then
              [ "${VERIFY_RESULT}" = "success" ] || exit 1
            fi
            echo "shard-weights (required=${WEIGHTS_REQUIRED}, main push): ${WEIGHTS_RESULT}"
            if [ "${WEIGHTS_REQUIRED}" = "true" ]; then
              [ "${WEIGHTS_RESULT}" = "success" ] || exit 1
            fi
          elif [ "${CODE_PATH}" = "false" ]; then
            echo "prior-run (latest code run of this head sha, every leg green): ${PRIOR_RESULT}"
            [ "${PRIOR_RESULT}" = "success" ] || exit 1
          else
            echo "unknown path '${CODE_PATH}'"
            exit 1
          fi
          echo "commit-email (noreply author and committer): ${EMAIL_RESULT}"
          echo "commit-attribution (commit messages and PR body): ${ATTRIBUTION_RESULT}"
          echo "commit-refs (issue footers): ${REFS_RESULT}"
          echo "review-log (no committed review notes): ${REVIEW_LOG_RESULT}"
          [ "${EMAIL_RESULT}" = "success" ] || exit 1
          [ "${ATTRIBUTION_RESULT}" = "success" ] || exit 1
          [ "${REFS_RESULT}" = "success" ] || exit 1
          [ "${REVIEW_LOG_RESULT}" = "success" ] || exit 1
