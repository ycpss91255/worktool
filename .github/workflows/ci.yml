name: CI

# worktool CI: lint + unit + integration + system (shim group) + acceptance
# in the shared test image, plus system-real (real-engine group) in its own
# docker-in-docker runner. All inside Docker. Runs on push and pull_request
# to main.
#
# Every gate is driven through the `just test` namespace, i.e. the same
# grammar a user types (`just test lint`, `just test unit`, ..., `just test
# system-real`; all of them at once: bare `just test`). Each recipe is a
# thin forwarder to script/test/test.sh (`--lint`, `--unit`, ...). The job
# NAMES stay lint / test-unit / test-integration / test-system /
# test-acceptance / test-system-real: branch protection and the ci-passed
# aggregator key on them, so the matrix maps each name to its tier instead
# of reusing the name as the tier.
#
# Every gate is REQUIRED: the `ci-passed` aggregator fails unless every gate
# job finished with `success` - a skipped, cancelled or missing gate does not
# read as green. (Inside each bats gate, test.sh likewise fails on a missing
# or emptied required spec, on skipped cases and on zero cases.)
#
# --privileged is used by the test-system-real job ONLY: its runner starts a
# nested dockerd so the real pinned distrobox can build and enter a real dev
# box. Everything it creates lives in that nested daemon and is destroyed
# with the runner container (docker run --rm).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build worktool-test image
        run: docker build -t worktool-test:local -f dockerfile/Dockerfile.test .

      - name: Save image
        run: docker save worktool-test:local -o /tmp/worktool-test.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: worktool-test-image
          path: /tmp/worktool-test.tar
          retention-days: 1

  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        # gate = job name (unchanged; branch protection keys on it)
        # tier = the `just test <tier>` that job runs
        include:
          - gate: lint
            tier: lint
          - gate: test-unit
            tier: unit
          - gate: test-integration
            tier: integration
          - gate: test-system
            tier: system
          - gate: test-acceptance
            tier: acceptance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test image
        uses: actions/download-artifact@v4
        with:
          name: worktool-test-image
          path: /tmp

      - name: Load test image
        run: docker load -i /tmp/worktool-test.tar

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run gate (${{ matrix.gate }} = just test ${{ matrix.tier }})
        env:
          TEST_IMAGE_PREBUILT: "1"
        run: just test ${{ matrix.tier }}

  # Real-engine system group: docker-in-docker. Builds its own runner image
  # (dockerfile/Dockerfile.system-real, independent of the shared test image)
  # and runs it with `docker run --rm --privileged` via `just test
  # system-real` (= test.sh --system-real). This is the ONLY job that
  # uses --privileged (GitHub-hosted ubuntu runners allow it). Slow: image
  # pull + apt inside the box; the runner itself bounds every step, and the
  # job is capped too.
  test-system-real:
    name: test-system-real
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run gate (test-system-real = just test system-real, docker-in-docker, --privileged)
        run: just test system-real

  # Single required status: green only if the image built AND every matrix
  # gate AND the real-engine gate succeeded. `if: always()` makes it run even
  # when a gate failed or was skipped, so that state is reported as a failure
  # rather than as "no check".
  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [build-image, gate, test-system-real]
    if: always()
    steps:
      - name: Verify every gate succeeded
        env:
          BUILD_RESULT: ${{ needs.build-image.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          SYSTEM_REAL_RESULT: ${{ needs.test-system-real.result }}
        run: |
          echo "build-image: ${BUILD_RESULT}"
          echo "gate (all matrix legs): ${GATE_RESULT}"
          echo "test-system-real (docker-in-docker): ${SYSTEM_REAL_RESULT}"
          [ "${BUILD_RESULT}" = "success" ] || exit 1
          [ "${GATE_RESULT}" = "success" ] || exit 1
          [ "${SYSTEM_REAL_RESULT}" = "success" ] || exit 1
