name: CI

# worktool CI: lint + unit + integration + system + acceptance, all inside
# Docker. Runs on push and pull_request to main.
#
# Every gate is REQUIRED: the `ci-passed` aggregator fails unless every gate
# job finished with `success` - a skipped, cancelled or missing gate does not
# read as green. (Inside each bats gate, ci.sh likewise fails on skipped or
# zero cases.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build worktool-test image
        run: docker build -t worktool-test:local -f dockerfile/Dockerfile.test .

      - name: Save image
        run: docker save worktool-test:local -o /tmp/worktool-test.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: worktool-test-image
          path: /tmp/worktool-test.tar
          retention-days: 1

  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        gate: [lint, test-unit, test-integration, test-system, test-acceptance]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test image
        uses: actions/download-artifact@v4
        with:
          name: worktool-test-image
          path: /tmp

      - name: Load test image
        run: docker load -i /tmp/worktool-test.tar

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run gate (${{ matrix.gate }})
        env:
          TEST_IMAGE_PREBUILT: "1"
        run: just -f justfile.ci ${{ matrix.gate }}

  # Single required status: green only if the image built AND every matrix
  # gate succeeded. `if: always()` makes it run even when a gate failed or was
  # skipped, so that state is reported as a failure rather than as "no check".
  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [build-image, gate]
    if: always()
    steps:
      - name: Verify every gate succeeded
        env:
          BUILD_RESULT: ${{ needs.build-image.result }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          echo "build-image: ${BUILD_RESULT}"
          echo "gate (all matrix legs): ${GATE_RESULT}"
          [ "${BUILD_RESULT}" = "success" ] || exit 1
          [ "${GATE_RESULT}" = "success" ] || exit 1
